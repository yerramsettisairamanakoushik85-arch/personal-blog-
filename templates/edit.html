<!DOCTYPE html>
<html>
<head><title>Edit Article</title></head>
<body>

<h1>Edit Article</h1>

<form method="POST">
    <input name="title" value="{{ post.title }}" required><br><br>
    <textarea name="content" rows="10" required>{{ post.content }}</textarea><br><br>
    <input name="date" type="date" value="{{ post.date }}" required><br><br>
    <button type="submit">Update</button>
</form>

<a href="/admin">Back</a>

</body>
</html>
